{{ define "main" }}

<header class="page-header">
    <div class="inner">
        <h1 class="post-title">{{ .Title }}</h1>
    </div>
</header>

<main class="content" role="main">
    <article class="post">
        <div class="inner">
            <section class="post-content">
                {{ .Content }}
            </section>
        </div>
    </article>
</main>

{{ end }}
