{{ define "main" }}

<header class="page-header">
    <div class="inner">
        <h1 class="post-title">{{ .Title }}</h1>
    </div>
</header>

<main class="content" role="main">
    <div class="container">
        {{ range .Pages }}
            {{ partial "post-card.html" . }}
        {{ end }}
    </div>
</main>

{{ end }}
