{{ $isHome := .IsHome }}
{{ $hasCover := false }}
{{ if and .IsHome .Site.Params.coverImage }}
    {{ $hasCover = true }}
{{ end }}
{{ if and (not .IsHome) .Params.cover }}
    {{ $hasCover = true }}
{{ end }}

<nav class="nav-header{{ if $hasCover }} has-cover{{ end }}">
    <div class="nav-wrapper">
        <ul class="nav-header-left">
            {{ range .Site.Menus.main }}
                <li{{ if eq .URL $.RelPermalink }} class="active"{{ end }}>
                    <a href="{{ .URL }}">{{ .Name }}</a>
                </li>
            {{ end }}
        </ul>
        <div class="nav-header-right">
            <a href="#" id="search-btn" class="nav-search" aria-label="Search">
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
            </a>
        </div>
    </div>
</nav>
